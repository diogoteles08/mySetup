# Change prefix to Ctrl-a
set -g prefix C-a
unbind C-b
# Press Ctrl-a twice to send Ctrl-a to the application inside tmux
bind C-a send-prefix

# Enable vi keys in copy mode (for scrollback navigation)
setw -g mode-keys vi

# Vim-like pane selection (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Enables natural mouse scroll
set -g mouse on
# Force WheelUp to enter copy mode and scroll up
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -et='"
# Allow WheelDown to scroll down in copy mode
bind-key -n WheelDownPane select-pane -t= \; send-keys -M
